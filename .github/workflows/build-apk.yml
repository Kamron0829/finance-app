name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:sms

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Sign with v1 + v2 + v3 schemes (older Huawei/EMUI installers need v1)
        run: |
          sed -i "s/keyPassword 'android'/keyPassword 'android'\n            enableV1Signing true\n            enableV2Signing true\n            enableV3Signing true/" android/app/build.gradle
          grep -n -A4 "signingConfigs {" android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk finance-app-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: finance-app-apk
          path: finance-app-${{ github.run_number }}.apk

      - name: Publish as GitHub release (easy download from phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Finance App build ${{ github.run_number }}
          files: finance-app-${{ github.run_number }}.apk
